name: email-invoice-guard

services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: email-invoice-guard:latest
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      DATABASE_PATH: /data/invoice-guard.db
      LISTEN_ADDRESS: ":8080"
      HEALTH_PATH: /healthz
      # TRUSTED_PROXY_CIDRS comes from .env and must match the backend subnet
      # below. Only those peers may assert X-Forwarded-Proto: https.
    volumes:
      - sqlite-data:/data
    networks:
      - backend
    # No published ports: the app is reachable only through Caddy.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  caddy:
    # Pinned to the current supported release (v2.11.9, 2026-11-05).
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # Caddy reads {$DOMAIN} from its process environment at startup.
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  # Public-facing network for Caddy (ACME + client traffic).
  edge:
  # Fixed, private subnet shared by Caddy and the app. The explicit subnet is
  # what TRUSTED_PROXY_CIDRS pins; do not widen it.
  backend:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:
